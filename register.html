<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Fitness</title>
    <link rel="stylesheet" href="login-style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script type="module" src="register.js" defer></script>

</head>
<body>
    <div class="wrapper">
        <form action="">
            <h1>Sign up</h1>
            <div class="input-box">
                <input type="email" placeholder="Email or phone" id="email" required>
                <i class='bx bxs-user'></i>
            </div>
            
            <div class="input-box">
                <input type="password" placeholder="Password" id="password" required>
                <i class='bx bxs-lock-alt' ></i>
            </div>

            <div class="remember-forgot">
                <label><input type="checkbox">Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button id="submit" type="submit" class="btn">Create account</button>

            <div class="register-link">
                <p>Already have an account? <a href="index.html">Sign in</a></p>
                <p>Login as a guest?  <a href="guest.html">GUEST LOGIN</a></p>
            </div>
        </form>
    </div>
    
</body>
</html>
